name: ExperimentsSmoke
# Runs every non-archived experiment script on a tiny problem (experiments/smoke.jl) and prints a pass/fail table. It is
# not triggered by pushes or pull requests, and no other check depends on it. Locally, smoke.jl runs the benchmarks one
# after the other to limit the memory; here each benchmark is its own job, so that they run in parallel.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # every Monday, 05:00 UTC
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: ${{ matrix.benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write # needed by julia-actions/cache to delete old caches that it has created
      contents: read
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - tt_poisson
          - tt_poisson_global
          - tt_anisotropy
          - tt_anisotropy_global
          - chorin_pipeline
          - chorin_pipeline_globalcg
          - liddriven_pipeline
          - liddriven_pipeline_globalcg
          - liddriven_cavity
          - tunnel2d
          - tunnel2dsteps
          - anisotropy_floor
          - linsolve_spd
          - mask_grid_selftest
          - mu_rules_check
          - tt_anisotropy_stats
          - chorin_pipeline_stats
    env:
      GKSwstype: "100" # headless GR backend for the plotting scripts
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Instantiate the environment of the experiments
        run: julia --project=experiments -e 'using Pkg; Pkg.instantiate()'
      - name: Run the smoke test
        run: julia --project=experiments experiments/smoke.jl ${{ matrix.benchmark }}
